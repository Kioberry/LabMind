# Every push to main builds the Dockerfile on Cloud Build and deploys it to the `labmind` Cloud Run service.
# Auth is keyless: GitHub's OIDC token is exchanged for the github-deployer service account (Workload Identity
# Federation, trusted for pushes to main of this repo only).
name: Deploy to Cloud Run

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: deploy-labmind
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: projects/840267766274/locations/global/workloadIdentityPools/github/providers/github-oidc
          service_account: github-deployer@daypilot-497913.iam.gserviceaccount.com

      - uses: google-github-actions/setup-gcloud@v2

      # No --allow-unauthenticated / --no-allow-unauthenticated: either flag rewrites who may call the service,
      # and leaving both out keeps the public access set on the service.
      # One instance only: the app keeps its experiment state on local disk.
      - name: Deploy
        run: >
          gcloud run deploy labmind --source . --region us-central1 --project daypilot-497913
          --set-secrets ANTHROPIC_API_KEY=labmind-anthropic-key:latest
          --set-env-vars FRONTEND_URL=https://kioberry.github.io
          --memory 1Gi --cpu 1 --no-cpu-throttling --min-instances 0 --max-instances 1 --timeout 300
          --quiet

      - name: Smoke test
        run: |
          code=$(curl -s -o /dev/null -w '%{http_code}' https://labmind-840267766274.us-central1.run.app/api/status)
          echo "GET /api/status -> $code"
          test "$code" = 200
